<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Cartridges flow</title>
  <desc id="desc">A long corpus creates full-context teacher answers, then a compact trainable KV cache is optimized and reused for follow-up questions.</desc>
  <rect width="1200" height="660" fill="#f7f2e9"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#312b24"/>
    </marker>
    <style>
      .title{font:700 34px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1e1a15}
      .box{fill:#fffaf1;stroke:#ccb99a;stroke-width:2;rx:8}
      .hot{fill:#9b5b34;stroke:#71401f;stroke-width:2;rx:8}
      .green{fill:#426f5b;stroke:#244d3d;stroke-width:2;rx:8}
      .txt{font:600 20px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#2a241d}
      .white{font:700 20px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .small{font:500 16px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#574e42}
      .arrow{stroke:#312b24;stroke-width:3;marker-end:url(#arrow);fill:none}
      .dash{stroke:#8d7b61;stroke-width:2;stroke-dasharray:8 8;fill:none}
      .center{text-anchor:middle}
    </style>
  </defs>
  <text class="title" x="68" y="66">Cartridges: optimize the memory artifact itself</text>

  <rect class="box" x="62" y="128" width="310" height="120"/>
  <text class="txt center" x="217" y="172">Long corpus</text>
  <text class="small center" x="217" y="206">document or chunk</text>
  <path class="arrow" d="M372 188 H420"/>

  <rect class="box" x="420" y="128" width="310" height="120"/>
  <text class="txt center" x="575" y="166">Full-context teacher</text>
  <text class="small center" x="575" y="198">answers questions with</text>
  <text class="small center" x="575" y="224">the whole context cache</text>
  <path class="arrow" d="M730 188 H778"/>

  <rect class="hot" x="778" y="128" width="310" height="120"/>
  <text class="white center" x="933" y="166">Sparse distillation</text>
  <text class="white center" x="933" y="198">optimize K<tspan baseline-shift="sub" font-size="70%">c</tspan>, V<tspan baseline-shift="sub" font-size="70%">c</tspan></text>
  <text class="white center" x="933" y="224">base model frozen</text>

  <path class="dash" d="M217 248 V390 H420"/>
  <rect class="box" x="420" y="330" width="310" height="120"/>
  <text class="txt center" x="575" y="370">Prefix initialization</text>
  <text class="small center" x="575" y="403">seed p KV slots from</text>
  <text class="small center" x="575" y="429">the first p tokens</text>
  <path class="arrow" d="M730 390 H778"/>

  <path class="arrow" d="M933 248 V330"/>
  <rect class="green" x="778" y="330" width="310" height="120"/>
  <text class="white center" x="933" y="370">Trained cartridge</text>
  <text class="white center" x="933" y="403">one compact KV cache</text>
  <text class="white center" x="933" y="429">for this corpus</text>

  <path class="arrow" d="M933 450 V560 H372"/>
  <rect class="box" x="62" y="500" width="310" height="120"/>
  <text class="txt center" x="217" y="545">Follow-up question</text>
  <text class="small center" x="217" y="580">short prompt + cartridge</text>
</svg>
