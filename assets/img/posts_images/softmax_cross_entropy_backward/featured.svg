<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Softmax and cross-entropy backward pass</title>
  <desc id="desc">A diagram showing the softmax Jacobian-vector product and the cross-entropy p minus y gradient.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f3ea"/>
      <stop offset="100%" stop-color="#e7f1ee"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#17312f" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#paper)"/>
  <g opacity="0.22" stroke="#8ba39b" stroke-width="1">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200M0 630H1200"/>
    <path d="M100 0V675M200 0V675M300 0V675M400 0V675M500 0V675M600 0V675M700 0V675M800 0V675M900 0V675M1000 0V675M1100 0V675"/>
  </g>
  <text x="92" y="105" fill="#17312f" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700">Softmax and Cross-Entropy</text>
  <text x="94" y="154" fill="#47645e" font-family="Inter, Arial, sans-serif" font-size="28">backpropagation, from the full Jacobian to p - y</text>

  <g transform="translate(86 220)" filter="url(#shadow)">
    <rect width="468" height="292" rx="18" fill="#ffffff" stroke="#bfd1ca"/>
    <text x="34" y="54" fill="#0f2d2b" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Softmax backward</text>
    <text x="34" y="101" fill="#263f3b" font-family="Menlo, Consolas, monospace" font-size="29">J = diag(s) - s s<tspan baseline-shift="super" font-size="19">T</tspan></text>
    <text x="34" y="155" fill="#263f3b" font-family="Menlo, Consolas, monospace" font-size="29">dz = J ds</text>
    <line x1="34" y1="184" x2="434" y2="184" stroke="#d4e0db" stroke-width="2"/>
    <text x="34" y="231" fill="#7a3f2d" font-family="Menlo, Consolas, monospace" font-size="27">dot = sum(s * ds)</text>
    <text x="34" y="270" fill="#7a3f2d" font-family="Menlo, Consolas, monospace" font-size="27">dz = s * (ds - dot)</text>
  </g>

  <g transform="translate(646 220)" filter="url(#shadow)">
    <rect width="468" height="292" rx="18" fill="#ffffff" stroke="#bfd1ca"/>
    <text x="34" y="54" fill="#0f2d2b" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Cross-entropy logits</text>
    <text x="34" y="101" fill="#263f3b" font-family="Menlo, Consolas, monospace" font-size="29">L = -y<tspan baseline-shift="super" font-size="19">T</tspan> z + LSE(z)</text>
    <text x="34" y="155" fill="#263f3b" font-family="Menlo, Consolas, monospace" font-size="29">p = softmax(z)</text>
    <line x1="34" y1="184" x2="434" y2="184" stroke="#d4e0db" stroke-width="2"/>
    <text x="34" y="231" fill="#7a3f2d" font-family="Menlo, Consolas, monospace" font-size="31" font-weight="700">dL/dz = p - y</text>
    <text x="34" y="270" fill="#47645e" font-family="Inter, Arial, sans-serif" font-size="22">the gradient is with respect to logits</text>
  </g>
</svg>
