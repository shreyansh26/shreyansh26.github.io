<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Canon local causal flow</title>
  <desc id="desc">A current token receives a residual connection plus weighted causal signals from the previous three token states.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9b3d20"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2b2015" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1400" height="760" fill="#f7f0e3"/>
  <g opacity="0.22" stroke="#d8c7aa" stroke-width="1">
    <path d="M0 110H1400M0 220H1400M0 330H1400M0 440H1400M0 550H1400M0 660H1400"/>
    <path d="M140 0V760M280 0V760M420 0V760M560 0V760M700 0V760M840 0V760M980 0V760M1120 0V760M1260 0V760"/>
  </g>

  <text x="78" y="92" fill="#15120d" font-family="Georgia, serif" font-size="54" font-weight="700">Canon local flow</text>
  <text x="82" y="139" fill="#665d4d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">a cheap causal path from nearby past tokens into the current token</text>

  <g filter="url(#shadow)">
    <rect x="92" y="364" width="170" height="108" rx="12" fill="#fffaf0" stroke="#d0ba94" stroke-width="2"/>
    <rect x="330" y="364" width="170" height="108" rx="12" fill="#fffaf0" stroke="#d0ba94" stroke-width="2"/>
    <rect x="568" y="364" width="170" height="108" rx="12" fill="#fffaf0" stroke="#d0ba94" stroke-width="2"/>
    <rect x="806" y="364" width="170" height="108" rx="12" fill="#fffaf0" stroke="#d0ba94" stroke-width="2"/>
    <rect x="1110" y="324" width="210" height="188" rx="14" fill="#15120d" stroke="#8e7650" stroke-width="2"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="177" y="424" fill="#15120d" font-size="32">h<tspan baseline-shift="sub" font-size="19">t-3</tspan></text>
    <text x="415" y="424" fill="#15120d" font-size="32">h<tspan baseline-shift="sub" font-size="19">t-2</tspan></text>
    <text x="653" y="424" fill="#15120d" font-size="32">h<tspan baseline-shift="sub" font-size="19">t-1</tspan></text>
    <text x="891" y="424" fill="#15120d" font-size="32">h<tspan baseline-shift="sub" font-size="19">t</tspan></text>
    <text x="1215" y="408" fill="#fff4df" font-size="34">h'<tspan baseline-shift="sub" font-size="20">t</tspan></text>
    <text x="1215" y="452" fill="#cdbf9f" font-size="21">local + residual</text>
  </g>

  <g fill="none" stroke="#9b3d20" stroke-width="5" marker-end="url(#arrow)">
    <path d="M177 364 C260 250 930 246 1108 344"/>
    <path d="M415 364 C500 282 940 284 1108 374"/>
    <path d="M653 364 C730 314 964 322 1108 404"/>
    <path d="M976 418 C1028 418 1062 418 1108 434"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#702611" text-anchor="middle">
    <rect x="244" y="238" width="74" height="36" rx="18" fill="#fffaf0" stroke="#d0ba94"/>
    <text x="281" y="262">w3</text>
    <rect x="503" y="270" width="74" height="36" rx="18" fill="#fffaf0" stroke="#d0ba94"/>
    <text x="540" y="294">w2</text>
    <rect x="760" y="302" width="74" height="36" rx="18" fill="#fffaf0" stroke="#d0ba94"/>
    <text x="797" y="326">w1</text>
    <rect x="978" y="430" width="112" height="40" rx="20" fill="#fffaf0" stroke="#d0ba94"/>
    <text x="1034" y="456">w0 + id</text>
  </g>

  <g transform="translate(160 585)">
    <rect width="1080" height="86" rx="12" fill="#fffaf0" stroke="#d0ba94" stroke-width="2"/>
    <text x="42" y="36" fill="#15120d" font-family="Georgia, serif" font-size="26" font-weight="700">One channel at one position</text>
    <text x="42" y="67" fill="#15120d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">output = h_t + w0*h_t + w1*h(t-1) + w2*h(t-2) + w3*h(t-3)</text>
  </g>
</svg>
